services:
  ollama:
    image: ollama/ollama:0.40.5
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h          # Modell im RAM halten -> schnelle Antworten
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Lädt das LLM einmalig herunter (danach liegt es im Volume ollama_data)
  ollama-init:
    image: ollama/ollama:0.40.5
    container_name: ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  classifier:
    build: ./classifier
    container_name: classifier
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL=${MODEL:-llama3.2:3b}
      - IMAP_HOST=imap.gmail.com
      - IMAP_USER=${GMAIL_USER}
      - IMAP_PASSWORD=${GMAIL_APP_PASSWORD}
      - ABSENDER_NAME=${ABSENDER_NAME:-Kundenservice}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - EXECUTIONS_DATA_PRUNE=true      # alte Ausführungen löschen (Dauerbetrieb)
      - EXECUTIONS_DATA_MAX_AGE=168     # 7 Tage
      # Adressen kommen aus .env und werden im Workflow per $env.XYZ gelesen
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GMAIL_USER=${GMAIL_USER}
      - INFO_EMAIL=${INFO_EMAIL}
      - ABSENDER_NAME=${ABSENDER_NAME:-Kundenservice}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      classifier:
        condition: service_healthy
    restart: unless-stopped

  # Nur für lokale Tests mit workflow.json (Webhook): docker compose --profile test up
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    profiles: ["test"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
